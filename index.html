
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Student Task Manager</h1>
        <p>Organize your studies. Achieve your goals.</p>
    </header>

    <main class="container">
        <section class="summary">
            <div class="summary-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>
            <div class="summary-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
            <div class="summary-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
        </section>

        <section class="panel">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <label for="taskTitle">Task Name</label>
                <input type="text" id="taskTitle"
                    placeholder="e.g. Complete Maths Assignment" required>

                <label for="subject">Subject</label>
                <select id="subject" required>
                    <option value="">Select a subject</option>
                    <option>Mathematics</option>
                    <option>Computer Science</option>
                    <option>English</option>
                    <option>Physics</option>
                    <option>Other</option>
                </select>

                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" required>

                <button type="submit" class="add-button">
                    + Add Task
                </button>
            </form>
        </section>

        <section class="panel">
            <div class="task-heading">
                <h2>My Tasks</h2>
                <select id="filterTasks" aria-label="Filter tasks">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div id="taskList"></div>
            <p id="emptyMessage">No tasks yet. Add your first task!</p>
        </section>
    </main>

    <footer>
        <p>Student Task Manager | Stay organized, stay successful!</p>
    </footer>

    <script src="script.js"></script>
    <!-- My first pull request update -->
</body>

</html>
